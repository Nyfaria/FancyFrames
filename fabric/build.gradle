plugins {
    id 'multiloader-loader'
    alias(libs.plugins.loom.fabric)
    alias(libs.plugins.mod.publish)
    alias(libs.plugins.regutils.loader)
}


sourceSets.main.resources { srcDir project(":common").file('src/generated/resources').getAbsolutePath() }

dependencies {
    minecraft "com.mojang:minecraft:${libs.versions.minecraft}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${libs.versions.parchment.minecraft}:${libs.versions.parchment.version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${libs.versions.fabric.loader}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${libs.versions.fabric.api}"
    modApi(libs.fabric.config.api)
    include(libs.fabric.config.api)
}

loom {
    def aw = project(":common").file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("runs/client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("runs/server")
        }
    }
}

publishMods {
    file = remapJar.archiveFile
    changelog = project(":common").file("changelog.md").text
    type = STABLE
    modLoaders.add("fabric")
    displayName = "${mod_name}-${libs.versions.minecraft}-[Fabric]-${project.version}"
    dryRun = dry_run.toBoolean()
    if (curseforge_publishing_enabled.toBoolean()) {
        curseforge {
            projectId = curseforge_project_id
            accessToken = curseforge_token
            minecraftVersions.add(libs.versions.minecraft)
            clientRequired = true
            serverRequired = true
            javaVersions.add(JavaVersion.VERSION_21)
            requires {
                slug = "fabric-api"
            }
        }
    }
    if (modrinth_publishing_enabled.toBoolean()) {
        modrinth {
            accessToken = modrinth_token
            projectId = modrinth_project_id
            minecraftVersions.add(libs.versions.minecraft)
            requires {
                slug = "fabric-api"
            }
        }
    }
}